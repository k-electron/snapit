language = "C"
header = """/* snapit engine C ABI. MIT licensed.
 * Generated by cbindgen from engine/src. Do not edit by hand:
 * run scripts/generate-header.sh. CI fails when this file is stale. */"""
include_guard = "SNAPIT_ENGINE_H"
cpp_compat = false
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c"
