name: OSV-Scanner

on:
  push:
    branches: [main, "integration/**"]
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-latest
      upload-sarif: false
