name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CBINDGEN_VERSION: "0.29.4"

jobs:
  build-and-test:
    name: Build and test (macOS 26, arm64)
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode 26 toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 26' || { echo "expected Xcode 26 on the macos-26 image" >&2; exit 1; }

      - name: Pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cbindgen
        id: cbindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cbindgen
          key: cbindgen-${{ env.CBINDGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --version "$CBINDGEN_VERSION" --locked --root "$RUNNER_TEMP/cbindgen"

      - name: Build and test
        run: |
          export PATH="$RUNNER_TEMP/cbindgen/bin:$PATH"
          scripts/test.sh
