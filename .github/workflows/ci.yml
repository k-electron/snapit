name: CI

on:
  push:
    branches: [main, "integration/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CBINDGEN_VERSION: "0.29.4"

jobs:
  build-and-test:
    name: Build and test (Xcode 27, arm64)
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Xcode 27 toolchain
        run: |
          # The newest Xcode 27 on the image (a patch release replaces the previous one).
          XCODE="$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE/Contents/Developer" xcodebuild -version

      - name: Pinned Rust toolchain
        run: rustup toolchain install

      - name: Cache cbindgen
        id: cbindgen-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cbindgen
          key: cbindgen-${{ env.CBINDGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cbindgen
        if: steps.cbindgen-cache.outputs.cache-hit != 'true'
        run: cargo install cbindgen --version "$CBINDGEN_VERSION" --locked --root "$RUNNER_TEMP/cbindgen"

      - name: Build and test
        run: |
          export PATH="$RUNNER_TEMP/cbindgen/bin:$PATH"
          scripts/test.sh
